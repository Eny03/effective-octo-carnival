services:
  # PolitiLens - Piattaforma Unificata Tutto-in-Uno
  # Serve sia le API e lo scheduler orario, sia l'App Web & PWA per smartphone
  - type: web
    name: politilens
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: INGESTION_INTERVAL_MINUTES
        value: "10"
      - key: ENABLE_AUTO_SCHEDULER
        value: "true"
