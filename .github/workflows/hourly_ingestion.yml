name: Trigger Scansione Web Continuo (24/7)

on:
  schedule:
    # Esegue un ping di keepalive e trigger scansione ogni 30 minuti
    - cron: '*/30 * * * *'
  workflow_dispatch: # Permette anche l'avvio manuale su richiesta da GitHub

jobs:
  trigger_scan:
    name: Ping e Trigger Scansione PolitiLens
    runs-on: ubuntu-latest
    steps:
      - name: Esegui ping keepalive e trigger scansione su Render
        run: |
          echo "Pinging PolitiLens production server..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 30 -X POST https://politclens.onrender.com/api/ingestion/trigger || echo "000")
          echo "Response status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "Scansione avviata con successo sul server live!"
          else
            echo "Server in fase di risveglio o risposta differita (status $STATUS). Non bloccante."
          fi
          exit 0
