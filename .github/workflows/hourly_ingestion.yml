name: Keepalive & Trigger Scansione PolitiLens (24/7)

on:
  schedule:
    # Ping ogni 5 minuti per prevenire lo spin-down di Render (free tier)
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  keepalive_and_scan:
    name: Keepalive + Trigger Scansione
    runs-on: ubuntu-latest
    steps:
      - name: Ping keepalive (GET health)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 20 https://politclens.onrender.com/api/health || echo "000")
          echo "Health ping: $STATUS"
          exit 0

      - name: Trigger scansione web (POST ingestion) ogni 30 min
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && contains(github.run_id, '0')) }}
        run: |
          # Trigger ogni 6 ping (≈30 min) per non sovraccaricare
          MINUTE=$(date +%M)
          if [ $((10#$MINUTE % 30)) -lt 5 ]; then
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 30 -X POST https://politclens.onrender.com/api/ingestion/trigger || echo "000")
            echo "Ingestion trigger: $STATUS"
          else
            echo "Keepalive only this cycle (minute: $MINUTE)"
          fi
          exit 0
