version: '3.8'

services:
  # Database PostgreSQL con estensione pgvector (100% open-source)
  db:
    image: pgvector/pgvector:pg16
    container_name: politilens-db
    restart: always
    environment:
      POSTGRES_DB: politilens
      POSTGRES_USER: politilens_user
      POSTGRES_PASSWORD: politilens_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U politilens_user -d politilens"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend FastAPI REST API & Ingestion Engine
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: politilens-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://politilens_user:politilens_password@db:5432/politilens
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_EXTRACTION_MODEL: qwen2.5:14b
      OLLAMA_CHAT_MODEL: qwen2.5:14b
      OLLAMA_EMBED_MODEL: bge-m3
      INGESTION_INTERVAL_MINUTES: 30
      ENABLE_AUTO_SCHEDULER: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Frontend Next.js Dashboard & Chatbot UI
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: politilens-frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
